type: object
required:
  - order_uuid
  - user_uuid
  - part_uuids
  - total_price
  - transaction_uuid
properties:
  order_uuid:
    type: string
    description: UUID заказа
    example: 123e4567-e89b-12d3-a456-426614174000
  user_uuid:
    type: string
    description: UUID пользователя
    example: 123e4567-e89b-12d3-a456-426614174000
  part_uuids:
    type: array
    description: Список UUID частей
    items:
      type: string
      description: UUID части
      example: f47ac10b-be5d-49a8-b4f4-2009b5491280
    minItems: 0
    uniqueItems: true
  total_price:
    type: number
    format: float
    description: Цена заказа
    example: 100.00
  transaction_uuid:
    type: string
    description: UUID транзакции
    example: 123e4567-e89b-12d3-a456-426614174000
